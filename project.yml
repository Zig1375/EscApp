# Generates EscApp.xcodeproj: `xcodegen generate`. The project file isn't committed; this is the source of truth.
name: EscApp
options:
  bundleIdPrefix: com.zig1375
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The app is ESCAPP_VERSION.ESCAPP_BUILD. Only the first two parts live here; the release job in
    # .github/workflows/ci.yml numbers builds 1, 2, 3… across all versions (scripts/next-version.sh) and passes
    # ESCAPP_BUILD. A local build is build 0. Keep EscAppCommand.version the same (a test checks it).
    ESCAPP_VERSION: "1.0"
    ESCAPP_BUILD: "0"
    MARKETING_VERSION: "$(ESCAPP_VERSION).$(ESCAPP_BUILD)"
    CURRENT_PROJECT_VERSION: "$(ESCAPP_BUILD)"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  EscApp:
    path: .
targets:
  EscApp:
    type: application
    platform: macOS
    sources:
      - App/EscApp
    info:
      path: App/EscApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # EscApp opens Windows programs and installers. "Default" rank: EscApp becomes their app unless the user
        # already picked another one; Settings offers to make EscApp the default.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Windows Program
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.microsoft.windows-executable]
          - CFBundleTypeName: Windows Installer
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.microsoft.windows-installer]
          # A game's CD. "Alternate": Finder keeps mounting disc images itself; EscApp is in "Open With" and
          # takes an image dropped on its icon or window.
          - CFBundleTypeName: Disc Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.iso-image]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.microsoft.windows-executable
            UTTypeDescription: Windows Program
            UTTypeConformsTo: [public.data, public.executable]
            UTTypeTagSpecification:
              public.filename-extension: [exe]
          - UTTypeIdentifier: com.microsoft.windows-installer
            UTTypeDescription: Windows Installer
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [msi]
    dependencies:
      - package: EscApp
        product: EscAppKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zig1375.EscApp
        PRODUCT_NAME: EscApp
        # App/EscApp/AppIcon.icon (Icon Composer): macOS 26 shapes it itself; Xcode renders the older sizes.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EscApp
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "Apache-2.0"
        # Wine needs to load unsigned code and map executable memory, which the sandbox forbids.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
      configs:
        # Debug signs from App/Signing.xcconfig (target settings would override it, so signing isn't in `base`).
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
    configFiles:
      Debug: App/Signing.xcconfig
