# Generates MagicKettle.xcodeproj: `xcodegen generate`. The project file isn't committed; this is the source of truth.
name: MagicKettle
options:
  bundleIdPrefix: com.zig1375
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The app is MAGICKETTLE_VERSION.MAGICKETTLE_BUILD. Only the first two parts live here; the release job in
    # .github/workflows/ci.yml takes the build number from the release tag's last part (vX.Y.N, numbered 1, 2, 3…
    # across all versions: scripts/next-version.sh) and passes MAGICKETTLE_BUILD. A local build is build 0. Keep MagicKettleCommand.version the same (a test checks it).
    MAGICKETTLE_VERSION: "1.0"
    MAGICKETTLE_BUILD: "0"
    MARKETING_VERSION: "$(MAGICKETTLE_VERSION).$(MAGICKETTLE_BUILD)"
    CURRENT_PROJECT_VERSION: "$(MAGICKETTLE_BUILD)"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  MagicKettle:
    path: .
  # Updates the app itself (AppUpdater). The same version's tools sign releases in ci.yml (scripts/appcast.sh).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  MagicKettle:
    type: application
    platform: macOS
    sources:
      - App/MagicKettle
    info:
      path: App/MagicKettle/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: the newest release's appcast.xml, and the public half of the key ci.yml signs releases with.
        SUFeedURL: https://github.com/Zig1375/MagicKettle/releases/latest/download/appcast.xml
        SUPublicEDKey: 0px5Il6ozIc1xcFv70Cbs36fr0eO3CQb9mCupOg4prs=
        # Daily checks from the first launch, without Sparkle asking for permission on the second one.
        SUEnableAutomaticChecks: true
        # Magic Kettle opens Windows programs and installers. "Default" rank alone leaves them with an app the user
        # picked before (Whisky), so Magic Kettle also takes them on its first launch (`claimExeFilesOnce`).
        # An .msi is com.microsoft.msi-installer on a Mac where Whisky declared it, so both types are listed.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Windows Program
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.microsoft.windows-executable]
          - CFBundleTypeName: Windows Installer
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.microsoft.windows-installer, com.microsoft.msi-installer]
          # A game's CD. "Alternate": Finder keeps mounting disc images itself; Magic Kettle is in "Open With" and
          # takes an image dropped on its icon or window.
          - CFBundleTypeName: Disc Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.iso-image]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.microsoft.windows-executable
            UTTypeDescription: Windows Program
            UTTypeConformsTo: [public.data, public.executable]
            UTTypeTagSpecification:
              public.filename-extension: [exe]
          - UTTypeIdentifier: com.microsoft.windows-installer
            UTTypeDescription: Windows Installer
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [msi]
    dependencies:
      - package: MagicKettle
        product: MagicKettleKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zig1375.MagicKettle
        # The app is "Magic Kettle.app", so the menu bar and About say the name with its space; Swift code imports
        # the module without one.
        PRODUCT_NAME: Magic Kettle
        PRODUCT_MODULE_NAME: MagicKettle
        # App/MagicKettle/AppIcon.icon (Icon Composer): macOS 26 shapes it itself; Xcode renders the older sizes.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Magic Kettle"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "Apache-2.0"
        # Wine needs to load unsigned code and map executable memory, which the sandbox forbids.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Releases are signed ad hoc, which gives no team: library validation then refused the embedded
        # Sparkle.framework ("different Team IDs") and the app quit at launch.
        CODE_SIGN_ENTITLEMENTS: App/MagicKettle/MagicKettle.entitlements
        ENABLE_PREVIEWS: YES
      configs:
        # Debug signs from App/Signing.xcconfig (target settings would override it, so signing isn't in `base`).
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
    configFiles:
      Debug: App/Signing.xcconfig
