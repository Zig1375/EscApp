# Generates Rum.xcodeproj: `xcodegen generate`. The project file isn't committed; this is the source of truth.
name: Rum
options:
  bundleIdPrefix: com.zig1375
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  Rum:
    path: .
targets:
  Rum:
    type: application
    platform: macOS
    sources:
      - App/Rum
    dependencies:
      - package: Rum
        product: RumKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zig1375.Rum
        PRODUCT_NAME: Rum
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rum
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "Apache-2.0"
        # Wine needs to load unsigned code and map executable memory, which the sandbox forbids.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: YES
