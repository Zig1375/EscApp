name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: |
          swiftlint lint --strict
      - name: Unit tests
        run: swift test
      - name: Build the app
        run: |
          xcodegen generate
          xcodebuild -project ExePort.xcodeproj -scheme ExePort -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
      - name: Every UI string has a Russian translation
        run: scripts/check-translations.py .build/xcode
