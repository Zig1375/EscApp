name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: |
          swiftlint lint --strict
      - name: Unit tests
        run: swift test
      - name: Build the app
        run: |
          xcodegen generate
          xcodebuild -project Rum.xcodeproj -scheme Rum -configuration Debug \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build
