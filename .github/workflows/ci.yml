name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: |
          swiftlint lint --strict
      - name: Unit tests
        run: swift test
      - name: Build the app
        run: |
          xcodegen generate
          xcodebuild -project Plaviox.xcodeproj -scheme Plaviox -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
      - name: Every UI string is translated into every language
        run: scripts/check-translations.py .build/xcode

  # Every push to main that passes becomes a release: tag vX.Y.N and Plaviox-X.Y.N.zip (ad-hoc signed, not
  # notarized). One at a time, so two quick pushes never take the same build number.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tools
        run: brew install xcodegen
      - name: Version
        id: version
        run: |
          read -r version build <<< "$(scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Build the app
        run: |
          xcodegen generate
          xcodebuild -project Plaviox.xcodeproj -scheme Plaviox -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode \
            PLAVIOX_BUILD=${{ steps.version.outputs.build }} \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build
          app=.build/xcode/Build/Products/Release/Plaviox.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" \
            = "${{ steps.version.outputs.version }}"
          ditto -c -k --keepParent "$app" "Plaviox-${{ steps.version.outputs.version }}.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" "Plaviox-${{ steps.version.outputs.version }}.zip" \
            --target "$GITHUB_SHA" --title "Plaviox ${{ steps.version.outputs.version }}" --generate-notes
